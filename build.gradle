plugins { id 'com.android.application' version '8.2.2' }

android {
    namespace 'com.megroups.chit'
    compileSdk 35

    defaultConfig {
        applicationId 'com.megroups.chit'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['build/gen-java']
            assets.srcDirs = ['build/gen-assets']
        }
    }

    lint {
        abortOnError false
    }
}

def genJavaTask = tasks.register('genMeGroupsJava', Copy) {
    from('MainActivity.java')
    into('build/gen-java/com/megroups/chit')
}

def genAssetsTask = tasks.register('genMeGroupsAssets', Copy) {
    from('index.html')
    into('build/gen-assets')
}

tasks.matching { it.name.startsWith('compile') && it.name.endsWith('JavaWithJavac') }.configureEach {
    dependsOn(genJavaTask)
}

tasks.matching { it.name.startsWith('merge') && it.name.endsWith('Assets') }.configureEach {
    dependsOn(genAssetsTask)
}
