plugins { id 'com.android.application' version '8.2.2' }

android {
    namespace 'com.megroups.chit'
    compileSdk 35

    defaultConfig {
        applicationId 'com.megroups.chit'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['.']
            assets.srcDirs = ['.']
        }
    }

    lint {
        abortOnError false
    }
}

afterEvaluate {
    tasks.findAll { it.name.startsWith('merge') && it.name.endsWith('Assets') }.each { mergeTask ->
        tasks.findAll { it.name.startsWith('create') && it.name.endsWith('CompatibleScreenManifests') }.each { manifestTask ->
            mergeTask.dependsOn(manifestTask)
        }
    }
}
